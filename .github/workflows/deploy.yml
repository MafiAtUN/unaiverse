name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that's mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        # `npm ci` is the strict path and stays the default. But npm prunes
        # platform-specific optional deps (@emnapi/*) out of a lockfile written
        # on macOS, so a Linux `npm ci` fails on a lockfile that is otherwise
        # perfectly correct. That has blocked this deploy three times. Fall back
        # rather than lose a deploy to a known npm quirk — and shout about it,
        # so a genuine drift still gets noticed and fixed with `npm run relock`.
        run: |
          npm ci || {
            echo "::warning::npm ci failed — lockfile likely missing platform-specific optional deps. Falling back to npm install. Run 'npm run relock' locally and commit the result."
            npm install --no-audit --no-fund
          }

      - name: Validate the AI literacy corpus
        # Runs before the build and needs no credentials: schema, term-link
        # integrity, quiz answers, analogy limitations, screen-reader
        # alternatives. A corpus that fails this must not reach a reader.
        run: npm run content:validate

      - name: Type check
        # `astro check` over the components and the .ts libraries. Cheap, and
        # it fails fast: a type error should stop a deploy here rather than
        # surface as a blank section on the live site.
        run: npm run check
        env:
          ASTRO_TELEMETRY_DISABLED: '1'

      - name: Build
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'

      - name: Test
        # After the build on purpose: half these assertions run against dist/,
        # including the sweep that proves no Azure identifier or .env value
        # reached the published output.
        run: npm test

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
