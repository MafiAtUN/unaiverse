name: Factual correction
description: A date, document symbol, link, quotation or explanation is wrong
title: "Correction: "
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most valuable kind of issue for this project, and the one
        that gets fixed fastest. You do not need to run anything or know any
        code to file it.

  - type: input
    id: where
    attributes:
      label: Where is it
      description: The page URL, or the milestone id, or the term slug.
      placeholder: https://mafiatun.github.io/unaiverse/m/... or learn/gradient-descent
    validations:
      required: true

  - type: textarea
    id: says
    attributes:
      label: What it currently says
      description: Paste the sentence or field as it appears now.
    validations:
      required: true

  - type: textarea
    id: should
    attributes:
      label: What it should say
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Source
      description: >
        A link to the official document, or the document symbol. Corrections
        without a source cannot be applied, because every claim on this site
        keeps its receipt.
      placeholder: https://docs.un.org/... or A/RES/79/239
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Optional. Why it matters, or what it would mislead someone into.
    validations:
      required: false
